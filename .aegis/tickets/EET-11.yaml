id: EET-11
goal: The route registration test checks that the static, web, health and ETF routes are all registered, and passes on both older FastAPI and FastAPI 0.143+.
context: >
  FastAPI 0.143 (pulled in by the unpinned `fastapi>=0.115.0`) adds each
  included router to `app.routes` as one lazy `_IncludedRouter` without a
  `path`, so the test's set of paths no longer contains the web, health and
  ETF routes even though the app serves them. The fix is in the test only: it
  also collects the paths of each included router's original routes. App code
  and dependencies stay unchanged. GitHub issue #11, standalone.
epic: null
depends_on: []
human_gates: []
allowed_areas:
  - .aegis/tickets/EET-11.yaml
  - tests/test_web_routes.py
must_not_touch:
  - fondant/
  - alembic/
  - pyproject.toml
  - .env
non_goals:
  - Pinning or capping FastAPI or Starlette.
  - Changing how the app includes routers.
  - The caplog test failure in the same file (issue #12).
acceptance_criteria:
  - "test_app_startup_registers_static_web_and_api_routes_together passes with FastAPI 0.143, and its list of asserted paths is unchanged."
  - "The test still fails if a router is not included: removing `app.include_router(web_router)` from create_app makes it fail (checked without committing that change)."
  - "Only tests/test_web_routes.py and the ticket file change."
verify:
  - .venv/Scripts/python -m pytest -q tests/test_web_routes.py -k registers_static
  - .venv/Scripts/ruff check tests/test_web_routes.py
  - git diff --check
smoke: []
manual_checks: []

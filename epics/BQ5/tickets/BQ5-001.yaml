ticket_id: BQ5-001
dispatched_by: master-planner
goal: Define detailed BusinessQuery layout, release-date, formatting, documentation-width, and per-ISIN notional requirements before implementation.
dependencies:
  - BQ4 merged to main at b26bd36 or later
  - Current repo branch must be development.
allowed_areas:
  - Documentation/Validation/BQ5-001_BUSINESS_QUERY_LAYOUT_AND_NOTIONAL_REQUIREMENTS.md
must_not_touch:
  - fondant/
  - alembic/
  - tests/
  - scripts/
  - .env
  - .env.example
  - docker-compose.yml
  - pyproject.toml
requirements:
  - Document the current BusinessQuery result layout and saved/group pages.
  - Define how OeKB release date from TAXRPT/TAXMDT should be shown in the result description.
  - Define wider result-table and wider Documentation layout expectations.
  - Define display-only FX-rate rounding to 4 decimals while preserving full precision for computation and CSV unless explicitly changed later.
  - Define saved/group table display formatting for amount to 2 decimals and updated timestamp to date plus hour/minute without seconds or milliseconds.
  - Plan the visual design and future architecture for multiple ISINs with different notional values.
  - List BQ5-002 through BQ5-005 follow-up tickets.
non_goals:
  - No code changes.
  - No migrations.
  - No BusinessQuery calculation changes.
  - No per-ISIN notional implementation.
acceptance_criteria:
  - Requirements document is readable standalone.
  - Document mentions TAXMDT, OeKB release date, wider results, wider documentation, FX rate 4 decimals, amount 2 decimals, updated date/hour/minute, and per-ISIN notionals.
  - Scope is documentation-only.
manual_verification_required: false
manual_verification_steps: []
verification_commands:
  - rg -n "TAXMDT|OeKB release date|wider|FX rate|4 decimals|2 decimals|date.*hour|notional|multiple ISIN" Documentation/Validation/BQ5-001_BUSINESS_QUERY_LAYOUT_AND_NOTIONAL_REQUIREMENTS.md
  - git diff --check
  - git status --short --branch --untracked-files=all
completion_report_required: true
business_context: >
  The BusinessQuery UI now has richer data, but non-technical users need the
  result view and saved/group tables to be easier to read and interpret.
user_or_operator_outcome: >
  Users understand the release date, can scan wider tables, and can review a
  clear plan for per-ISIN notional inputs before deeper query-model changes.
design_concept: >
  Keep current BusinessQuery workflows, improve display clarity first, and
  defer per-ISIN notional execution until the UX and data model are approved.
architecture_boundary: Documentation only.
success_signal: A validated requirements artifact can drive the GUI tickets.
tradeoffs_or_constraints: >
  Per-ISIN notionals are intentionally only planned here because implementation
  will require service and likely saved-query persistence changes.


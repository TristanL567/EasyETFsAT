name: User story
description: A need described from a user's point of view. Add it as a sub-issue of an epic, or leave it standalone for small work.
labels: [user-story]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      placeholder: |
        As a <role>,
        I want <capability>,
        so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes, one per line (for example Given / When / Then).
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Context, examples, out of scope.
  - type: dropdown
    id: gates
    attributes:
      label: Human gates
      options:
        - fully automatic (no gates)
        - ticket
        - merge
        - ticket and merge
      default: 0

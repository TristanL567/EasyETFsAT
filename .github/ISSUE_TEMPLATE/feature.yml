name: Feature
description: New or changed functionality. Add it as a sub-issue of an epic, or leave it standalone for small work.
labels: [feature]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The behavior to add or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who needs it and what it enables.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes, one per line.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: dropdown
    id: gates
    attributes:
      label: Human gates
      options:
        - fully automatic (no gates)
        - ticket
        - merge
        - ticket and merge
      default: 0
